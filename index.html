<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Familiar - macOS Style</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-canvas: #e5e5ea;
            --window-bg: rgba(246, 246, 246, 0.85);
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.9);
            --text-main: #1d1d1f;
            --text-sec: #86868b;
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
            --accent-purple: #af52de;
            --shadow-window: 0 20px 40px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.04);
            --radius-window: 20px;
            --radius-card: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.8) 0%, transparent 75%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* macOS Window Frame */
        .mac-window {
            width: 100%;
            max-width: 1140px;
            background: var(--window-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: var(--radius-window);
            box-shadow: var(--shadow-window);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Window Header Bar */
        .window-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.3);
        }

        .traffic-lights {
            display: flex;
            gap: 8px;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .light.close { background: #ff5f56; border: 0.5px solid #e0443e; }
        .light.minimize { background: #ffbd2e; border: 0.5px solid #dea123; }
        .light.maximize { background: #27c93f; border: 0.5px solid #1aab29; }

        .window-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sec);
            letter-spacing: -0.2px;
        }

        /* Segmented Control Navigation */
        .segmented-control {
            display: flex;
            background: rgba(0, 0, 0, 0.06);
            padding: 3px;
            border-radius: 9px;
            gap: 2px;
        }

        .segment-btn {
            border: none;
            background: transparent;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 7px;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .segment-btn.active {
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12), 0 0 2px rgba(0,0,0,0.08);
            font-weight: 600;
        }

        /* Main Window Body */
        .window-body {
            padding: 28px;
        }

        .page {
            display: none;
            flex-direction: column;
            gap: 24px;
            animation: macFade 0.25s ease-out;
        }

        .page.active {
            display: flex;
        }

        @keyframes macFade {
            from { opacity: 0; transform: scale(0.995); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Cards */
        .mac-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 20px 24px;
            box-shadow: var(--shadow-card);
        }

        /* Metric Cards Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .metric-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-box label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sec);
        }

        .metric-box h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .metric-box.income h2 { color: var(--accent-green); }
        .metric-box.expense h2 { color: var(--accent-red); }
        .metric-box.balance h2 { color: var(--accent-blue); }
        .metric-box.car h2 { color: var(--accent-orange); }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-top: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        input, select {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.12);
            padding: 9px 12px;
            border-radius: 9px;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
            transition: all 0.15s ease;
        }

        input:focus, select:focus {
            background: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-top: 18px;
            cursor: pointer;
            color: var(--text-main);
        }

        .mac-btn {
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .mac-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            color: var(--text-sec);
            font-weight: 600;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            font-size: 11px;
            text-transform: uppercase;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }

        .tag {
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .tag.receita { background: rgba(52, 199, 89, 0.15); color: var(--accent-green); }
        .tag.despesa { background: rgba(255, 59, 48, 0.15); color: var(--accent-red); }
        .tag.fixa { background: rgba(175, 82, 222, 0.15); color: var(--accent-purple); }

        /* Status Toggle Buttons */
        .status-btn {
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .status-btn.pago { background: rgba(52, 199, 89, 0.15); color: var(--accent-green); }
        .status-btn.pendente { background: rgba(255, 149, 0, 0.15); color: var(--accent-orange); }
        .status-btn.vencido { background: rgba(255, 59, 48, 0.15); color: var(--accent-red); }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        /* Charts Layout */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
        }

        .chart-box {
            height: 340px;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .window-header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .charts-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="mac-window">
    <!-- Header estilo macOS -->
    <div class="window-header">
        <div style="display: flex; align-items: center; gap: 16px;">
            <div class="traffic-lights">
                <div class="light close"></div>
                <div class="light minimize"></div>
                <div class="light maximize"></div>
            </div>
            <span class="window-title">Controle Financeiro</span>
        </div>

        <div class="segmented-control">
            <button class="segment-btn active" onclick="switchPage('lancamentos')">Lançamentos</button>
            <button class="segment-btn" onclick="switchPage('relatorios')">Gráficos & Relatórios</button>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="window-body">

        <!-- PAGINA 1: Lançamentos -->
        <div id="lancamentos" class="page active">
            <!-- Cards de Métricas -->
            <div class="metrics-grid">
                <div class="mac-card metric-box income">
                    <label>Receitas Realizadas</label>
                    <h2 id="total-income">R$ 0,00</h2>
                </div>
                <div class="mac-card metric-box expense">
                    <label>Despesas Pagas</label>
                    <h2 id="total-expense">R$ 0,00</h2>
                </div>
                <div class="mac-card metric-box balance">
                    <label>Saldo Real (Pago/Recebido)</label>
                    <h2 id="total-balance">R$ 0,00</h2>
                </div>
                <div class="mac-card metric-box car">
                    <label>Gastos com Carro</label>
                    <h2 id="car-expense">R$ 0,00</h2>
                </div>
            </div>

            <!-- Formulário -->
            <div class="mac-card">
                <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">Novo Lançamento</h3>
                <form id="finance-form" onsubmit="addTransaction(event)">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Descrição</label>
                            <input type="text" id="desc" placeholder="Ex: Cartão de Crédito, Aluguel" required>
                        </div>
                        <div class="input-group">
                            <label>Valor (R$)</label>
                            <input type="number" step="0.01" id="amount" placeholder="0.00" required>
                        </div>
                        <div class="input-group">
                            <label>Tipo</label>
                            <select id="type" onchange="updateCategories()">
                                <option value="despesa">Despesa (Saída)</option>
                                <option value="receita">Receita (Entrada)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Categoria / Origem</label>
                            <select id="category"></select>
                        </div>
                        <div class="input-group">
                            <label>Data de Vencimento</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="input-group">
                            <label>Parcelas Restantes</label>
                            <input type="number" id="installments" min="1" value="1" placeholder="1 = Única">
                        </div>
                    </div>

                    <label class="checkbox-label">
                        <input type="checkbox" id="isFixed"> Fixa Mensal (Repete todo mês automaticamente)
                    </label>

                    <button type="submit" class="mac-btn">Salvar Lançamento</button>
                </form>
            </div>

            <!-- Tabela de Lançamentos -->
            <div class="mac-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="font-size: 15px; font-weight: 600;">Histórico de Lançamentos</h3>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <label style="font-size: 12px; color: var(--text-sec);">Mês:</label>
                        <input type="month" id="filter-month" onchange="renderApp()">
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Tipo</th>
                                <th>Parcela</th>
                                <th>Status</th>
                                <th>Valor</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-rows"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- PAGINA 2: Relatórios -->
        <div id="relatorios" class="page">
            <div class="charts-container">
                <div class="mac-card chart-box">
                    <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Gastos por Categoria (Rosca)</h3>
                    <div style="position: relative; flex: 1; min-height: 0;">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
                <div class="mac-card chart-box">
                    <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Entradas vs Saídas (Colunas)</h3>
                    <div style="position: relative; flex: 1; min-height: 0;">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('apple_finance_mac')) || [];
    let pieChartInstance = null;
    let barChartInstance = null;

    const categories = {
        despesa: ['Carro', 'Casa', 'Alimentação', 'Cartão de Crédito', 'Contas Fixas', 'Lazer', 'Outros'],
        receita: ['Marido', 'Esposa', 'Renda Extra', 'Outros']
    };

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date();
        document.getElementById('filter-month').value = today.toISOString().slice(0, 7);
        document.getElementById('date').valueAsDate = today;
        updateCategories();
        renderApp();
    });

    function switchPage(pageId) {
        document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));

        if(pageId === 'lancamentos') {
            document.querySelectorAll('.segment-btn')[0].classList.add('active');
            document.getElementById('lancamentos').classList.add('active');
        } else {
            document.querySelectorAll('.segment-btn')[1].classList.add('active');
            document.getElementById('relatorios').classList.add('active');
            renderCharts();
        }
    }

    function updateCategories() {
        const type = document.getElementById('type').value;
        const selectCat = document.getElementById('category');
        selectCat.innerHTML = '';
        categories[type].forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            selectCat.appendChild(opt);
        });
    }

    function addTransaction(e) {
        e.preventDefault();

        const desc = document.getElementById('desc').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const type = document.getElementById('type').value;
        const category = document.getElementById('category').value;
        const date = document.getElementById('date').value;
        const isFixed = document.getElementById('isFixed').checked;
        const installments = parseInt(document.getElementById('installments').value) || 1;

        // Se a data do lançamento for hoje ou retroativa, já entra como PAGO. Se for futura, PENDENTE.
        const todayStr = new Date().toISOString().split('T')[0];
        const initialStatus = (date <= todayStr) ? 'pago' : 'pendente';

        const baseItem = {
            id: Date.now(),
            desc,
            amount,
            type,
            category,
            date,
            isFixed,
            installments,
            currentInstallment: 1,
            status: initialStatus
        };

        if (!isFixed && installments > 1) {
            let [year, month, day] = date.split('-').map(Number);
            for (let i = 0; i < installments; i++) {
                let nextMonth = month + i;
                let nextYear = year + Math.floor((nextMonth - 1) / 12);
                let formattedMonth = ((nextMonth - 1) % 12 + 1).toString().padStart(2, '0');
                let formattedDay = day.toString().padStart(2, '0');
                let itemDate = `${nextYear}-${formattedMonth}-${formattedDay}`;

                transactions.push({
                    ...baseItem,
                    id: Date.now() + i,
                    date: itemDate,
                    currentInstallment: i + 1,
                    status: (itemDate <= todayStr) ? 'pago' : 'pendente'
                });
            }
        } else {
            transactions.push(baseItem);
        }

        saveAndRefresh();
        document.getElementById('finance-form').reset();
        document.getElementById('date').valueAsDate = new Date();
        updateCategories();
    }

    function toggleStatus(id) {
        const t = transactions.find(item => item.id === id);
        if (t) {
            t.status = (t.status === 'pago') ? 'pendente' : 'pago';
            saveAndRefresh();
        }
    }

    function deleteTransaction(id) {
        transactions = transactions.filter(t => t.id !== id);
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('apple_finance_mac', JSON.stringify(transactions));
        renderApp();
    }

    function getFilteredTransactions() {
        const filterMonth = document.getElementById('filter-month').value;
        return transactions.filter(t => t.isFixed || t.date.startsWith(filterMonth));
    }

    function renderApp() {
        const currentData = getFilteredTransactions();
        const tbody = document.getElementById('transaction-rows');
        tbody.innerHTML = '';

        let incReal = 0, expReal = 0, carExp = 0;
        const todayStr = new Date().toISOString().split('T')[0];

        currentData.forEach(t => {
            // Contabiliza no saldo real apenas o que está PAGO
            if (t.status === 'pago') {
                if (t.type === 'receita') incReal += t.amount;
                if (t.type === 'despesa') expReal += t.amount;
            }
            // Para o gráfico/resumo do carro, considera gastos do mês
            if (t.type === 'despesa' && t.category === 'Carro') carExp += t.amount;

            // Define badge visual do status
            let statusClass = t.status;
            let statusLabel = (t.status === 'pago') ? '✓ Pago' : '⏳ Pendente';

            if (t.status === 'pendente' && t.date < todayStr) {
                statusClass = 'vencido';
                statusLabel = '⚠ Vencido';
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${t.date.split('-').reverse().join('/')}</td>
                <td><strong>${t.desc}</strong> ${t.isFixed ? '<span class="tag fixa">Fixa</span>' : ''}</td>
                <td>${t.category}</td>
                <td><span class="tag ${t.type}">${t.type.toUpperCase()}</span></td>
                <td>${t.isFixed ? 'Mensal' : `${t.currentInstallment}/${t.installments}`}</td>
                <td>
                    <button class="status-btn ${statusClass}" onclick="toggleStatus(${t.id})">
                        ${statusLabel}
                    </button>
                </td>
                <td style="font-weight:600; color: ${t.type === 'receita' ? 'var(--accent-green)' : 'var(--accent-red)'}">
                    R$ ${t.amount.toLocaleString('pt-BR', {minimumFractionDigits: 2})}
                </td>
                <td><button class="btn-delete" onclick="deleteTransaction(${t.id})">Remover</button></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('total-income').textContent = `R$ ${incReal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        document.getElementById('total-expense').textContent = `R$ ${expReal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        document.getElementById('total-balance').textContent = `R$ ${(incReal - expReal).toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        document.getElementById('car-expense').textContent = `R$ ${carExp.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
    }

    function renderCharts() {
        const currentData = getFilteredTransactions();

        const categoriesMap = {};
        currentData.filter(t => t.type === 'despesa').forEach(t => {
            categoriesMap[t.category] = (categoriesMap[t.category] || 0) + t.amount;
        });

        const pieCtx = document.getElementById('pieChart').getContext('2d');
        if (pieChartInstance) pieChartInstance.destroy();

        pieChartInstance = new Chart(pieCtx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(categoriesMap),
                datasets: [{
                    data: Object.values(categoriesMap),
                    backgroundColor: ['#ff9500', '#ff3b30', '#007aff', '#af52de', '#34c759', '#86868b', '#5856d6'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } }
            }
        });

        let inc = 0, exp = 0;
        currentData.forEach(t => {
            if (t.type === 'receita') inc += t.amount;
            if (t.type === 'despesa') exp += t.amount;
        });

        const barCtx = document.getElementById('barChart').getContext('2d');
        if (barChartInstance) barChartInstance.destroy();

        barChartInstance = new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: ['Visão do Mês'],
                datasets: [
                    { label: 'Entradas (R$)', data: [inc], backgroundColor: '#34c759', borderRadius: 6 },
                    { label: 'Saídas (R$)', data: [exp], backgroundColor: '#ff3b30', borderRadius: 6 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } }
            }
        });
    }
</script>

</body>
</html>
